{
    "jobs": [{
        "name": "param:persist.assessment.is_active=*",
        "condition": "persist.assessment.is_active=*",
        "cmds": [
            "ohsetprop persist.assessment.is_examination_running ${persist.assessment.is_active}"
        ]
    }, {
        "name": "param:bootevent.boot.completed=true",
        "condition": "bootevent.boot.completed=true",
        "cmds": [
            "setparam persist.assessment.is_active false"
        ]
    }],
    "services": [{
        "name" : "assessment_service",
        "path" : ["/system/bin/sa_main", "/system/profile/assessment_service.json"],
        "ondemand" : false,
        "uid" : "system",
        "gid" : ["system"],
        "apl" : "system_basic",
        "secon" : "u:r:assessment_service:s0",
        "permission" : [
            "ohos.permission.RUNNING_STATE_OBSERVER",
            "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
            "ohos.permission.START_SYSTEM_DIALOG",
            "ohos.permission.ACCESS_LOWPOWER_MANAGER",
            "ohos.permission.KILL_APP_PROCESSES",
            "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
            "ohos.permission.SWITCH_KIOSK_MODE",
            "ohos.permission.DISTRIBUTED_DATASYNC",
            "ohos.permission.GET_RUNNING_INFO",
            "ohos.permission.SET_TELEPHONY_STATE",
            "ohos.permission.ANSWER_CALL",
            "ohos.permission.MANAGE_CALL_FOR_DEVICES",
            "ohos.permission.GET_BUNDLE_RESOURCES",
            "ohos.permission.RUNNING_LOCK",
            "ohos.permission.INTERNET",
            "ohos.permission.GET_WIFI_INFO",
            "ohos.permission.DCAS_OTA_PERMISSION",
            "ohos.permission.DCAS_RUN_MODEL",
            "ohos.permission.AUTH_MODEL_DOWNLOAD
        ],
        "permission_acls": [
            "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
            "ohos.permission.DISTRIBUTED_DATASYNC",
            "ohos.permission.GET_RUNNING_INFO",
            "ohos.permission.SET_TELEPHONY_STATE",
            "ohos.permission.ANSWER_CALL",
            "ohos.permission.MANAGE_CALL_FOR_DEVICES"
        ]
    }]
}