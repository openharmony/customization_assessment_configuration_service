{
    "jobs": [{
        "name": "param:persist.assessment.is_active=*",
        "condition": "persist.assessment.is_active=*",
        "cmds": [
            "ohsetprop persist.assessment.is_examination_running ${persist.assessment.is_active}"
        ] 
    }],
    "services": [{
        "name" : "assessment_service",
        "path" : ["/system/bin/sa_main", "/system/profile/assessment_service.json"],
        "ondemand" : true,
        "uid" : "system",
        "gid" : ["system"],
        "apl" : "system_basic",
        "permission" : [
            "ohos.permission.RUNNING_STATE_OBSERVER",
            "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
            "ohos.permission.START_SYSTEM_DIALOG",
            "ohos.permission.ACCESS_LOWPOWER_MANAGER",
            "ohos.permission.SWITCH_KIOSK_MODE"
        ],
        "permission_acls": [
            "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED"
        ]
    }]
}